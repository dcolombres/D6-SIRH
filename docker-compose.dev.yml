# Local development with bind mounts (no image build required for PHP code).
# Prefer docker-compose.yml for test/staging handoff to DevOps.

name: d6-sirh-dev

services:
  app:
    image: php:8.3-fpm-bookworm
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - d6_dev_public:/shared/public
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      RUN_MIGRATIONS: "true"
      RUN_SEEDERS: "true"
      CACHE_CONFIG: "false"
    command: >
      bash -c "docker-php-ext-install pdo_mysql >/tmp/ext.log 2>&1
      && cp -a public/. /shared/public/
      && php-fpm -F"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - d6

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-3848}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - d6_dev_public:/var/www/html/public:ro
    depends_on:
      - app
    networks:
      - d6

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-d6_sirh}
      MYSQL_USER: ${DB_USERNAME:-d6}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
    ports:
      - "${MYSQL_PUBLISH_PORT:-3307}:3306"
    volumes:
      - d6_dev_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootsecret}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - d6

networks:
  d6:

volumes:
  d6_dev_mysql:
  d6_dev_public:
